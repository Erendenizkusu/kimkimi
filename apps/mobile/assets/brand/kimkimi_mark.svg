<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none" role="img" aria-labelledby="kkMarkTitle">
  <title id="kkMarkTitle">KimKimi</title>
  <defs>
    <linearGradient id="kkMarkGrad" x1="4" y1="8" x2="76" y2="72" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5b21b6"/>
      <stop offset="0.45" stop-color="#9333ea"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <filter id="kkMarkDrop" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1e1033" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- 0ki oyuncu / iki daire kesi_imi: ortak tahmin alan1 -->
  <circle cx="28" cy="40" r="24" fill="url(#kkMarkGrad)" filter="url(#kkMarkDrop)"/>
  <circle cx="52" cy="40" r="24" fill="url(#kkMarkGrad)" fill-opacity="0.9" filter="url(#kkMarkDrop)"/>
  <text
    x="40"
    y="53"
    text-anchor="middle"
    font-size="34"
    font-weight="800"
    fill="#fafafa"
    font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
  >?</text>
</svg>
